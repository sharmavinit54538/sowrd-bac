services:
  db:
    image: postgres:16-alpine
    container_name: sword_erp_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sword_erp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sword_erp"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sword_erp_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/sword_erp
      - SECRET_KEY=c3917862f9872e45bf9487c0a969bd65a123e4567890abcdef1234567890abcd
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - PROJECT_NAME=Sword Innovations ERP
      - CORS_ORIGINS=["http://localhost:5173","http://localhost:8080","*"]
      - COMPANY_STATE_CODE=08
      - COMPANY_STATE_NAME=Rajasthan
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:

